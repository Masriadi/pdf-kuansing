# GitHub Actions workflow for deployment to Cloudflare Pages
# Triggers on push to main branch
# Builds the static export and deploys to Cloudflare Pages

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Restore cache for faster builds
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build the project
      - name: Build with Next.js
        run: npm run build
        env:
          NODE_ENV: production

      # Upload build artifact for deployment
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ./out

  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Download build artifact
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./out

      # Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: pdf-kuansing
          directory: ./out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
